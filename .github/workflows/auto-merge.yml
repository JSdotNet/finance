name: Auto-merge

# Merges a pull request once every other check on its head commit has finished
# green. A standalone workflow rather than a job at the end of the build one,
# because a path-filtered workflow does not run on every pull request and a
# check in another workflow (CodeQL) cannot be a `needs:` dependency.
#
# Draft pull requests are never merged: the job skips them, and marking one
# ready for review starts it. Converting a pull request back to a draft cancels
# a waiting run and turns off GitHub auto-merge if it was on.
#
# Pull requests into a plan/<slug> branch are merged too: marking one ready is
# the merge signal whatever the base. GitHub auto-merge needs a protected base,
# so the Merge step merges directly when the base has neither branch protection
# nor a ruleset (today every base, main included) and uses --auto otherwise.
#
# A merge made with the default GITHUB_TOKEN does not trigger the push
# workflows on the base branch, so the merge uses the AUTO_MERGE_TOKEN secret
# (a fine-grained token with Contents and Pull requests read/write) when the
# repository has one, and falls back to GITHUB_TOKEN when it does not.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Auto-merge when green
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for every other check on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Other workflows register their check runs a few seconds after this
          # one starts, and a CodeQL result posts after its analysis jobs end,
          # so settle first and require two quiet polls in a row.
          sleep 30
          quiet=0
          while :; do
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name | test("^(Auto-merge when green|Turn off auto-merge for a draft)$") | not) | [.name, .status, (.conclusion // "")] | @tsv')
            statuses=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              --jq '.statuses[] | [.context, .state] | @tsv')

            failed=$(printf '%s\n' "$runs" | awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "neutral" && $3 != "skipped" { print $1 " (" $3 ")" }'
                     printf '%s\n' "$statuses" | awk -F'\t' '$2 == "failure" || $2 == "error" { print $1 " (" $2 ")" }')
            if [ -n "$failed" ]; then
              echo "::error::Not merging; these checks did not pass:"
              printf '%s\n' "$failed"
              exit 1
            fi

            pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed" { print $1 }'
                      printf '%s\n' "$statuses" | awk -F'\t' '$2 == "pending" { print $1 }')
            if [ -z "$pending" ]; then
              quiet=$((quiet + 1))
              [ "$quiet" -ge 2 ] && break
            else
              quiet=0
              echo "Waiting on: $(printf '%s' "$pending" | paste -sd ',' -)"
            fi
            sleep 30
          done
          echo "Every other check passed."

      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
        run: |
          # The pull request may have become a draft or moved on while this
          # run waited; merge only the commit that was checked.
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft,headRefOid,baseRefName --jq '"\(.isDraft) \(.headRefOid) \(.baseRefName)"')
          if [ "${info% *}" != "false $SHA" ]; then
            echo "Pull request is a draft or has a newer commit; not merging."
            exit 0
          fi
          base=${info##* }

          # GitHub auto-merge needs a protected base: classic branch protection
          # or a ruleset. With one, --auto defers to the base's own required
          # checks and merges at once when nothing is left to wait for.
          base_path=$(jq -rn --arg b "$base" '$b | @uri')
          classic=$(gh api "repos/$GITHUB_REPOSITORY/branches/$base_path" --jq .protected)
          rules=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$base_path" --jq length)
          if [ "$classic" = "true" ] || [ "$rules" -gt 0 ]; then
            echo "$base is protected; merging with --auto."
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$SHA"
            exit 0
          fi

          # Without protection, --auto fails unless the merge state is already
          # CLEAN, HAS_HOOKS or UNSTABLE, so merge directly: the previous step
          # saw every check pass. When a sibling pull request into the same base
          # merges first, GitHub reports UNKNOWN while it recomputes, and may
          # refuse with "Base branch was modified"; wait, then try again.
          echo "$base has no protection rules; merging directly."
          for attempt in 1 2 3; do
            for _ in $(seq 1 20); do
              merge_state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
              [ "$merge_state" != "UNKNOWN" ] && break
              sleep 6
            done
            if [ "$merge_state" = "UNKNOWN" ]; then
              echo "::warning::Merge state still UNKNOWN after two minutes; merging anyway."
            fi
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA" && exit 0
            echo "Merge attempt $attempt (state $merge_state) failed."
            sleep 10
          done
          echo "::error::Not merged after three attempts."
          exit 1

  back-to-draft:
    name: Turn off auto-merge for a draft
    if: ${{ github.event.action == 'converted_to_draft' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --disable-auto || true
